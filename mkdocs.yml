site_name: Snowflake Mastery Path
site_description: A free Snowflake course — architecture, virtual warehouses, loading data, semi-structured data, Time Travel, micro-partitions and clustering, Snowpipe, streams, tasks, dynamic tables, governance, data sharing, Snowpark, Cortex and cost control.
site_url: https://sigilipelli.github.io/snowflake-mastery-path/
repo_url: https://github.com/sigilipelli/snowflake-mastery-path
repo_name: snowflake-mastery-path

theme:
  name: material
  favicon: assets/favicon.svg
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: light blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: light blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css
  - stylesheets/progress-tracker.css

extra_javascript:
  - javascripts/progress-tracker.js

nav:
  - Home: index.md
  - Privacy Policy: privacy.md
  - License: license.md
  - "Level 1 · Snowflake Foundations":
      - Overview: level-1/index.md
      - "01 · How Snowflake Is Built: Storage, Compute & Services": level-1/01-architecture.md
      - "02 · Accounts, Snowsight, Snowflake CLI & Python": level-1/02-accounts-and-clients.md
      - "03 · Databases, Schemas, Tables & Data Types": level-1/03-objects-and-types.md
      - "04 · Virtual Warehouses: Sizing, Suspend & Credits": level-1/04-virtual-warehouses.md
      - "05 · Loading Data: Stages, File Formats & COPY INTO": level-1/05-loading-copy-into.md
      - "06 · Snowflake SQL: Windows, QUALIFY & Extensions": level-1/06-snowflake-sql.md
      - "07 · Semi-Structured Data: VARIANT & FLATTEN": level-1/07-semi-structured.md
      - "08 · Time Travel, UNDROP & Fail-safe": level-1/08-time-travel-failsafe.md
      - "09 · Zero-Copy Cloning & Environments": level-1/09-zero-copy-cloning.md
